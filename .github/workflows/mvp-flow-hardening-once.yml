name: MVP flow hardening once

on:
  push:
    branches:
      - fix/mvp-flow-hardening
    paths:
      - ".github/workflows/mvp-flow-hardening-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mvp-flow-hardening
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply targeted source patch
        run: node scripts/apply-mvp-flow-hardening.mjs

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden invoice MVP flow"
          git push origin HEAD:fix/mvp-flow-hardening
