name: Verify MVP flow hardening once

on:
  push:
    branches:
      - fix/mvp-flow-hardening
    paths:
      - ".github/workflows/verify-mvp-flow-once.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bella_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d bella_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bella_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/bella_test
      STRIPE_ACTIVE: "false"
      CI: "true"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mvp-flow-hardening
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:init

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused MVP tests serially
        run: >-
          npx playwright test
          tests/invoice-workspace-readonly-e2e.spec.ts
          tests/invoice-workspace-readonly-source.spec.ts
          tests/appointment-invoice-flow.spec.ts
          tests/free-invoice-flow.spec.ts
          tests/invoice-archive-links.spec.ts
          --workers=1

      - name: Remove one-shot workflow
        if: always()
        run: |
          rm -f .github/workflows/verify-mvp-flow-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove one-shot MVP verification workflow"
            git push origin HEAD:fix/mvp-flow-hardening
          fi
